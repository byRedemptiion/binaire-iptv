<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Binaire IPTV</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Connexion -->
<section id="login">
  <div class="center">
    <form class="card" id="f-login">
      <div class="brand">Binaire<b>IPTV</b></div>
      <p class="lead">Connecte-toi à ton compte pour retrouver tes abonnements et profils.</p>
      <input type="email" id="email" placeholder="E-mail du compte" autocomplete="username">
      <input type="password" id="pass" placeholder="Mot de passe" autocomplete="current-password">
      <div class="msg" id="l-msg"></div>
      <button id="l-go" type="submit">Se connecter</button>
    </form>
  </div>
</section>

<!-- Qui regarde ? -->
<section id="who" class="hidden">
  <div class="center">
    <h1>Qui regarde ?</h1>
    <div class="profiles" id="profList"></div>
  </div>
</section>

<!-- Accueil -->
<section id="home" class="hidden">
  <div class="topbar">
    <img class="logo" src="./logo.png" alt="Binaire">
    <div class="sp"></div>
    <select id="subPick" title="Abonnement"></select>
    <div class="chip" id="profChip"><span class="dot"></span><span id="profName">Moi</span></div>
    <button class="ghost" id="logout" style="min-height:34px;font-size:13px">Quitter</button>
  </div>
  <div class="tiles">
    <div class="tile tv" data-kind="live"><div class="ic">📺</div><div class="t">TV</div><div class="d">Chaînes en direct</div></div>
    <div class="tile films" data-kind="movie"><div class="ic">🎬</div><div class="t">FILMS</div><div class="d">Films à la demande</div></div>
    <div class="tile series" data-kind="series"><div class="ic">📚</div><div class="t">SÉRIES</div><div class="d">Séries et épisodes</div></div>
    <div class="tile reg" id="tileSettings"><div class="ic">⚙️</div><div class="t">RÉGLAGES</div><div class="d">Abonnement, profil, favoris</div></div>
  </div>
</section>

<!-- Navigation TV / Films / Séries -->
<section id="browse" class="hidden">
  <header>
    <button class="ghost" id="backHome" style="min-height:34px">← Accueil</button>
    <div class="title" id="browseTitle">TV</div>
    <div class="sp"></div>
    <input type="search" id="search" placeholder="Rechercher…">
  </header>
  <div class="cats" id="cats"></div>
  <div class="content" id="content"></div>
</section>

<!-- Réglages -->
<section id="settings" class="hidden">
  <div class="center">
    <div class="card" style="width:460px">
      <div class="brand" style="font-size:20px">Réglages</div>
      <label class="lead">Abonnement utilisé</label>
      <select id="setSub"></select>
      <label class="lead">Profil</label>
      <select id="setProf"></select>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="sec" id="setFavs">Mes favoris</button>
        <button class="sec" id="setBack">Retour</button>
      </div>
      <p class="lead" id="setInfo" style="font-size:13px"></p>
    </div>
  </div>
</section>

<!-- Détail série -->
<div id="seriesOverlay" class="overlay hidden">
  <div class="bar"><div class="title" id="seriesTitle" style="font-weight:800"></div><div class="sp"></div><button class="ghost" id="seriesClose">Fermer ✕</button></div>
  <div class="body"><div class="seasons" id="seasons"></div><div class="eplist" id="eplist"></div></div>
</div>

<!-- Lecteur -->
<div id="player" class="overlay hidden">
  <div class="bar"><div class="title" id="playTitle" style="font-weight:800"></div><div class="sp"></div><button class="ghost" id="playClose">Fermer ✕</button></div>
  <div style="flex:1;position:relative"><video id="video" controls autoplay></video><div class="player-hint hidden" id="playHint"></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
