name: Binaire Windows (maquette)

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Binaire-IPTV-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publie l'exe en release (téléchargeable directement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Binaire IPTV — Windows (maquette)
          files: desktop/dist/*.exe
          make_latest: false
